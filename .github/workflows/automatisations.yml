name: Automatisations
# Les automatisations (rappels de rendez-vous, relances, demandes d'avis…) tournent chaque matin
# grâce au cron Vercel (vercel.json → /api/cron). Ce workflow ne sert plus qu'à les lancer à la main.
# Pour un passage toutes les heures : renseigner la variable SITE_URL et le secret CRON_SECRET du dépôt,
# puis remettre ici « schedule: - cron: '0 * * * *' ».
on:
  workflow_dispatch:
jobs:
  cron:
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: curl -fsS --max-time 300 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ vars.SITE_URL }}/api/cron"
